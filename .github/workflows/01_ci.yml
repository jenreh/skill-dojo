name: 01 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Pytest
        run: uv run pytest -q --cov

  cli-without-web:
    name: CLI wheel without the web extra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"

      - name: Build the core and CLI wheels
        run: |
          uv build --package skill-dojo-core --out-dir dist
          uv build --package skill-dojo --out-dir dist

      - name: Install them into a fresh venv and run the CLI
        run: |
          uv venv --python 3.14 /tmp/cli-venv
          uv pip install --python /tmp/cli-venv/bin/python dist/*.whl
          /tmp/cli-venv/bin/skill-dojo --version
          if /tmp/cli-venv/bin/python -c "import reflex" 2>/dev/null; then
            echo "reflex must not be installed without the web extra" >&2
            exit 1
          fi

      - name: Scaffold and validate a marketplace with the installed CLI
        run: |
          mkdir /tmp/marketplace
          cd /tmp/marketplace
          git init -q
          /tmp/cli-venv/bin/skill-dojo init --name ci --tool-version 0.0.0
          /tmp/cli-venv/bin/skill-dojo validate
          /tmp/cli-venv/bin/skill-dojo build --check
