[project]
name = "skill-dojo-web"
version = "0.0.0"
description = "Local web UI of skill-dojo (Reflex + appkit-mantine)."
readme = "README.md"
authors = [{ name = "Jens Rehpöhler" }]
license = { text = "MIT" }
requires-python = ">=3.14"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "appkit-mantine>=1.19.1",
    "reflex>=0.11.0",
    "skill-dojo-core~=0.0.0",
]

[project.urls]
Homepage = "https://github.com/jenreh/skill-dojo"
Repository = "https://github.com/jenreh/skill-dojo"

[tool.uv.sources]
skill-dojo-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
