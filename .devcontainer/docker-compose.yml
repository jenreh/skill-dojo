services:
  app:
    container_name: skill-dojo-dev
    image: skill-dojo/ui-dev
    build:
      # The Dockerfile copies nothing, so only send this folder as build context
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: 3.14-trixie
    volumes:
      # Only this project: sibling repos and their .env files stay out of reach of
      # the tools and coding agents running in the container.
      - ..:/workspaces/skill-dojo:rw,cached
      # Survives rebuilds: uv, pre-commit and antidote caches, uv-managed Python and
      # tools, claude logins and plugins (symlinked, see Dockerfile)
      - dev-state:/home/vscode/.persist
    command: sleep infinity
    networks:
      - skill-dojo-network

networks:
  skill-dojo-network:
    driver: bridge

volumes:
  dev-state:
    name: skill-dojo-dev-state
