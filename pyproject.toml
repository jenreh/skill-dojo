[project]
name = "skill-dojo-workspace"
version = "0.0.0"
description = "Workspace root of skill-dojo (not published)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Jens Rehpöhler" }]
dependencies = [
    "skill-dojo-core",
    "skill-dojo[web]",
    "skill-dojo-web",
]

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-httpserver>=1.2.1",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["components/*"]

[tool.uv.sources]
skill-dojo-core = { workspace = true }
skill-dojo = { workspace = true }
skill-dojo-web = { workspace = true }

[tool.bumpversion]
commit = false
current_version = "0.0.0"
tag = false
allow-dirty = false

[[tool.bumpversion.files]]
filename = "components/skill-dojo-core/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/skill-dojo-cli/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "components/skill-dojo-web/pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# The CLI pins core exactly; the web extra and web's core pin are compatible
# releases, so a core + CLI release does not need a web release.
[[tool.bumpversion.files]]
filename = "components/skill-dojo-cli/pyproject.toml"
search = '"skill-dojo-core=={current_version}"'
replace = '"skill-dojo-core=={new_version}"'

[[tool.bumpversion.files]]
filename = "components/skill-dojo-cli/pyproject.toml"
search = '"skill-dojo-web~={current_major}.{current_minor}.0"'
replace = '"skill-dojo-web~={new_major}.{new_minor}.0"'

[[tool.bumpversion.files]]
filename = "components/skill-dojo-web/pyproject.toml"
search = '"skill-dojo-core~={current_major}.{current_minor}.0"'
replace = '"skill-dojo-core~={new_major}.{new_minor}.0"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[tool.ruff]
cache-dir = ".cache/ruff"
indent-width = 4
line-length = 88
target-version = "py314"
extend-exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".devcontainer",
    ".github",
    ".vscode",
    "build",
    "dist",
    "docs",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "EM101",
    "EM102",
    "ISC001",
    "N811",
    "N818",
    "PLR0913",
    "PT011",
    "PT012",
    "RUF012",
    "RUF100",
    "SIM300",
    "E501",
    "B008",
    "ASYNC240",
    "PYI034",
    "S101",
    "PLR0912",
    "ASYNC109",
    "ARG001",
    "PLR2004",
    "PLW0603",
    "PLC0415",
    "SIM105",
    "PLW2901",
    "PLR0911",
    "B017",
    "RUF001",
    "RUF002",
    "RUF003",
]
select = [
    "A",
    "ANN001",
    "ANN201",
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "EM",
    "EXE",
    "F",
    "FIX",
    "G",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLF001",
    "T20",
    "TID",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"test_**.py" = [
    "S101",
    "PLR2004",
    "ANN001",
    "S106",
    "SLF001",
    "RET504",
    "PERF401",
    "E402",
    "S501",
    "S110",
    "ARG002",
    "ARG005",
    "E741",
    "RUF059",
]
# Typer commands declare every CLI option as a parameter.
"components/skill-dojo-cli/src/**/*.py" = ["PLR0917"]
# Test helpers run git with fixed arguments.
"tests/support/*.py" = ["S603", "S607"]
# Command line scripts print their output and run tools with fixed arguments.
"{scripts,terraform}/*.py" = ["T201", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["*.pyi"]

[tool.ruff.lint.isort]
known-first-party = ["skill_dojo_core", "skill_dojo_cli", "skill_dojo_web"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = [
    "components/skill-dojo-core/tests",
    "components/skill-dojo-cli/tests",
    "components/skill-dojo-web/tests",
    "tests",
]
addopts = "--import-mode=importlib"
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# Type checking with `ty` (Astral). Run via `task typecheck` (uv run ty check).
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = [
    "components/skill-dojo-core/src",
    "components/skill-dojo-cli/src",
    "components/skill-dojo-web/src",
    "components/skill-dojo-core/tests",
    "components/skill-dojo-cli/tests",
    "components/skill-dojo-web/tests",
    "tests",
]
exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".venv",
    "build",
    "dist",
]

# Treat unresolved third-party imports as errors-off-by-default like mypy's
# ignore_missing_imports; ty resolves imports from the project venv instead.
[tool.ty.rules]
import-not-found = "warn"

[tool.coverage.run]
branch = true
source = ["skill_dojo_core", "skill_dojo_cli", "skill_dojo_web"]
omit = []

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "pragma: no cover"]
fail_under = 80
show_missing = true
skip_covered = true
