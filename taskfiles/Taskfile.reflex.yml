# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  RUNNER: uv run

tasks:
  # ----------------------------------------------------------------------------
  # Reflex Application Commands
  # ----------------------------------------------------------------------------

  # Extra serve options go after "--", e.g.
  #   task run -- --repo ~/Workspace/templates/agent-skills
  run:
    desc: Start the web UI with hot reload (task run -- --repo <dir>)
    cmd: "{{.RUNNER}} skill-dojo serve --reload {{.CLI_ARGS}}"

  run:debug:
    desc: Start the web UI with hot reload and debug logging
    cmd: "{{.RUNNER}} skill-dojo -v serve --reload {{.CLI_ARGS}}"

  run:prod:
    desc: Start the web UI as a prod build (no reload)
    cmd: "{{.RUNNER}} skill-dojo serve {{.CLI_ARGS}}"
