# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  RUNNER: uv run

tasks:
  default:
    desc: Show available commands
    cmd: task --list

  # ----------------------------------------------------------------------------
  # Release Commands
  # ----------------------------------------------------------------------------

  build:
    desc: |
      Usage: task release:build -- [major|minor|patch], defaults to 'patch'.
      Bumps version, commits, and creates a GitHub release.
    cmds:
      - uv run bump-my-version bump {{.CLI_ARGS | default "patch"}}
      - uv sync
      # Only the bumped, tracked files: never sweep stray untracked files into a release.
      - git add -u
      # A separate task, so VERSION is read after the bump.
      - task: push

  push:
    internal: true
    vars:
      VERSION:
        sh: uv version --short
    cmds:
      - 'git diff --cached --quiet || git commit -m "chore: release v{{.VERSION}}"'
      - git push
      # Tag the commit just pushed, not whatever the default branch points to.
      - gh release create v{{.VERSION}} --generate-notes --target "$(git rev-parse HEAD)"

  publish:
    desc: |
      Usage: task release:publish [-- --web]. Builds and publishes skill-dojo-core and
      skill-dojo; skill-dojo-web only with --web.
    vars:
      PACKAGES: >-
        skill-dojo-core skill-dojo{{if contains "--web" .CLI_ARGS}} skill-dojo-web{{end}}
    cmds:
      - rm -rf dist
      - for: { var: PACKAGES, split: " " }
        cmd: uv build --package {{.ITEM}} --out-dir dist
      - uv publish dist/*
      - echo "✅ Published {{.PACKAGES}}"
